    // --- SOUND NOTIFICATION HELPER ---
    const playAlertChime = (enabled) => {
      if (!enabled || typeof window === 'undefined') return;
      try {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        const ctx = new AudioCtx();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(587.33, ctx.currentTime);
        osc.frequency.setValueAtTime(880, ctx.currentTime + 0.14);
        gain.gain.setValueAtTime(0.18, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.45);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + 0.45);
      } catch (e) {}
    };

                        <span>Promo Discount ({appliedPromo})</span>
                        <span>- Rs. {discountAmount.toLocaleString()}</span>
                      </div>
                    )}
                    <div className="flex justify-between text-gray-300">
                      <span>PRA Sales Tax (16%)</span>
                      <span>Rs. {taxAmount.toLocaleString()}</span>
                    </div>
                    <div className="flex justify-between text-gray-300">
                      <span>Multan Standard Delivery Fee</span>
                      <span>Rs. {deliveryFee.toLocaleString()}</span>
                    </div>
                    <div className="flex justify-between text-base font-bold text-white pt-2 border-t border-white/10">
                      <span>Grand Total</span>
                      <span className="text-[#f01e2c]">Rs. {grandTotal.toLocaleString()}</span>
                    </div>

                    <button
                      onClick={() => {
                        setCheckoutStep(1);
                        setIsCheckoutOpen(true);
                      }}
                      className="w-full mt-3 py-3.5 bg-[#f01e2c] hover:bg-[#c81521] text-white font-bold rounded-xl text-sm transition-all shadow-lg shadow-[#f01e2c]/25"
                    >
                      Proceed to 2-Step Checkout
                    </button>
                  </div>
                )}
              </div>
            </div>
          )}

          {/* ==================== 2-STEP CHECKOUT MODAL ==================== */}
          {isCheckoutOpen && (
            <div className="fixed inset-0 z-50 bg-black/85 backdrop-blur-md flex items-center justify-center p-4">
              <div className="bg-[#141418] border border-[#f01e2c]/40 rounded-3xl max-w-lg w-full p-6 sm:p-8 space-y-6 max-h-[92vh] overflow-y-auto animate-fade-up">
                <div className="flex items-center justify-between border-b border-white/10 pb-4">
                  <div>
                    <span className="text-[11px] uppercase tracking-widest text-[#f01e2c]">
                      Step {checkoutStep} of 2
                    </span>
                    <h3 className="font-serif text-2xl font-bold text-white">
                      {checkoutStep === 1 ? 'Multan Delivery Details' : 'Select Payment Method'}
                    </h3>
                  </div>
                  <button onClick={() => setIsCheckoutOpen(false)} className="p-2 rounded-full bg-white/5 text-gray-400 hover:text-white">
                    <X className="w-5 h-5" />
                  </button>
                </div>

                {checkoutStep === 1 ? (
                  <form
                    onSubmit={(e) => {
                      e.preventDefault();
                      setCheckoutStep(2);
                    }}
                    className="space-y-4"
                  >
                    <div>
                      <label className="text-xs text-gray-400 block mb-1">Full Name *</label>
                      <input
                        required
                        value={customerName}
                        onChange={(e) => setCustomerName(e.target.value)}
                        placeholder="Enter your full name"
                        className="w-full bg-[#1C1C20] border border-white/15 rounded-xl p-3 text-sm text-white focus:border-[#f01e2c] outline-none"
                      />
                    </div>
                    <div>
                      <label className="text-xs text-gray-400 block mb-1">Mobile Number (Multan) *</label>
                      <input
                        required
                        type="tel"
                        value={customerPhone}
                        onChange={(e) => setCustomerPhone(e.target.value)}
                        placeholder="0300-1234567"
                        className="w-full bg-[#1C1C20] border border-white/15 rounded-xl p-3 text-sm text-white focus:border-[#f01e2c] outline-none"
                      />
                    </div>

                    <div>
                      <label className="text-xs text-gray-400 block mb-1.5">
                        Tap a Multan Area or Type Complete Address *
                      </label>
                      <div className="flex flex-wrap gap-1.5 mb-2">
                        {MULTAN_AREAS.slice(0, 6).map((area) => (
                          <button
                            key={area}
                            type="button"
                            onClick={() => setCustomerAddress(`${area}, Multan`)}
                            className="text-[11px] bg-white/5 hover:bg-[#f01e2c]/20 border border-white/10 hover:border-[#f01e2c] text-gray-300 px-2.5 py-1 rounded-full transition-all"
                          >
                            + {area}
                          </button>
                        ))}
                      </div>
                      <textarea
                        required
                        rows={2}
                        value={customerAddress}
                        onChange={(e) => setCustomerAddress(e.target.value)}
                        placeholder="House #, Street, Block, Sector (e.g. House 14, Block B, Model Town, Multan)"
                        className="w-full bg-[#1C1C20] border border-white/15 rounded-xl p-3 text-sm text-white focus:border-[#f01e2c] outline-none"
                      />
                    </div>

                    <div>
                      <label className="text-xs text-gray-400 block mb-1">Rider Instructions (Optional)</label>
                      <input
                        value={deliveryInstructions}
                        onChange={(e) => setDeliveryInstructions(e.target.value)}
                        placeholder="e.g. Ring bell twice, leave at security gate"
                        className="w-full bg-[#1C1C20] border border-white/15 rounded-xl p-3 text-sm text-white focus:border-[#f01e2c] outline-none"
                      />
                    </div>

                    <button
                      type="submit"
                      className="w-full py-3.5 bg-[#f01e2c] hover:bg-[#c81521] text-white font-bold rounded-xl text-sm transition-all shadow-lg shadow-[#f01e2c]/25"
                    >
                      Continue to Payment Options →
                    </button>
                  </form>
                ) : (
                  <form onSubmit={handleCompleteOrder} className="space-y-5">
                    <div className="grid grid-cols-3 gap-2.5">
                      <button
                        type="button"
                        onClick={() => setPaymentMethod('COD')}
                        className={`p-3 rounded-2xl border text-center flex flex-col items-center gap-1.5 transition-all ${
                          paymentMethod === 'COD'
                            ? 'border-[#f01e2c] bg-[#f01e2c]/15 text-white'
                            : 'border-white/10 bg-white/5 text-gray-400'
                        }`}
                      >
                        <Banknote className="w-5 h-5 text-[#f01e2c]" />
                        <span className="text-xs font-bold">Cash on Delivery</span>
                      </button>

                      <button
                        type="button"
                        onClick={() => setPaymentMethod('CARD')}
                        className={`p-3 rounded-2xl border text-center flex flex-col items-center gap-1.5 transition-all ${
                          paymentMethod === 'CARD'
                            ? 'border-[#f01e2c] bg-[#f01e2c]/15 text-white'
                            : 'border-white/10 bg-white/5 text-gray-400'
                        }`}
                      >
                        <CreditCard className="w-5 h-5 text-[#f01e2c]" />
                        <span className="text-xs font-bold">Debit / Credit Card</span>
                      </button>

                      <button
                        type="button"
                        onClick={() => setPaymentMethod('WALLET')}
                        className={`p-3 rounded-2xl border text-center flex flex-col items-center gap-1.5 transition-all ${
                          paymentMethod === 'WALLET'
                            ? 'border-[#f01e2c] bg-[#f01e2c]/15 text-white'
                            : 'border-white/10 bg-white/5 text-gray-400'
                        }`}
                      >
                        <Smartphone className="w-5 h-5 text-[#f01e2c]" />
                        <span className="text-xs font-bold">Apple / Google Pay</span>
                      </button>
                    </div>

                    {paymentMethod === 'COD' && (
                      <div className="p-4 rounded-2xl bg-[#f01e2c]/10 border border-[#f01e2c]/40 space-y-1">
                        <p className="text-xs text-[#FDA4AF] font-bold">Cash on Delivery Selected</p>
                        <p className="text-xs text-gray-300">
                          Please keep exact <strong className="text-white">Rs. {grandTotal.toLocaleString()}</strong> ready to hand over to Rider Bilal Ahmed upon arrival.
                        </p>
                      </div>
                    )}

                    {paymentMethod === 'CARD' && (
                      <div className="space-y-3 bg-[#1B1B20] p-4 rounded-2xl border border-white/10">
                        <p className="text-[11px] text-gray-400">
                          Sandbox Showcase Mode — No real money is charged.
                        </p>
                        <input
                          required
                          value={cardNumber}
                          onChange={(e) => setCardNumber(e.target.value)}
                          placeholder="Card Number (4242 •••• •••• 4242)"
                          className="w-full bg-[#121215] border border-white/15 rounded-xl p-2.5 text-xs text-white outline-none"
                        />
                        <div className="grid grid-cols-2 gap-2">
                          <input
                            required
                            value={cardExpiry}
                            onChange={(e) => setCardExpiry(e.target.value)}
                            placeholder="MM/YY"
                            className="bg-[#121215] border border-white/15 rounded-xl p-2.5 text-xs text-white outline-none"
                          />
                          <input
                            required
                            value={cardCvc}
                            onChange={(e) => setCardCvc(e.target.value)}
                            placeholder="CVC"
                            className="bg-[#121215] border border-white/15 rounded-xl p-2.5 text-xs text-white outline-none"
                          />
                        </div>
                      </div>
                    )}

                    {paymentMethod === 'WALLET' && (
                      <div className="p-4 rounded-2xl bg-white/5 border border-white/10 text-center space-y-2">
                        <p className="text-xs text-white font-semibold">
                          Instant One-Tap Express Authorization
                        </p>
                        <p className="text-[11px] text-gray-400">
                          Amount: Rs. {grandTotal.toLocaleString()} (Demo Mode — Rs. 0 charged)
                        </p>
                      </div>
                    )}

                    <div className="flex gap-3">
                      <button
                        type="button"
                        onClick={() => setCheckoutStep(1)}
                        className="px-4 py-3.5 rounded-xl border border-white/15 text-xs text-gray-300"
                      >
                        ← Back
                      </button>
                      <button
                        type="submit"
                        className="flex-1 py-3.5 bg-[#f01e2c] hover:bg-[#c81521] text-white font-bold rounded-xl text-sm transition-all shadow-xl shadow-[#f01e2c]/25"
                      >
                        Place Order & Start Live Tracking (Rs. {grandTotal.toLocaleString()})
                      </button>
                    </div>
                  </form>
                )}
              </div>
            </div>
          )}

          {/* ==================== RIDER CALL & CHAT MODALS ==================== */}
          {isCallModalOpen && (
            <div className="fixed inset-0 z-50 bg-black/80 flex items-center justify-center p-4">
              <div className="bg-[#16161A] border border-[#f01e2c]/40 rounded-3xl p-6 max-w-sm w-full text-center space-y-4">
                <div className="w-16 h-16 rounded-full bg-[#f01e2c]/20 border border-[#f01e2c] flex items-center justify-center mx-auto text-[#f01e2c] animate-pulse">
                  <Phone className="w-7 h-7" />
                </div>
                <h4 className="font-serif text-xl font-bold text-white">Calling Rider Bilal Ahmed...</h4>
                <p className="text-xs text-gray-400">TSO Multan Dispatch Bridge • +92 304 8765432</p>
                <button
                  onClick={() => setIsCallModalOpen(false)}
                  className="w-full py-3 rounded-xl bg-[#f01e2c] hover:bg-[#c81521] text-white font-bold text-xs"
                >
                  End Call
                </button>
              </div>
            </div>
          )}

          {isChatOpen && (
            <div className="fixed inset-0 z-50 bg-black/80 flex items-center justify-center p-4">
              <div className="bg-[#141418] border border-[#f01e2c]/40 rounded-3xl max-w-md w-full p-5 flex flex-col h-[440px]">
                <div className="flex justify-between items-center pb-3 border-b border-white/10">
                  <div>
                    <h4 className="font-bold text-white text-sm">Chat with Rider Bilal Ahmed</h4>
                    <span className="text-[10px] text-emerald-400">● Online • En Route in Multan</span>
                  </div>
                  <button onClick={() => setIsChatOpen(false)} className="text-gray-400 hover:text-white">
                    <X className="w-5 h-5" />
                  </button>
                </div>

                <div className="flex-1 overflow-y-auto py-4 space-y-3">
                  {chatMessages.map((m, idx) => (
                    <div key={idx} className={`flex flex-col ${m.sender === 'user' ? 'items-end' : 'items-start'}`}>
                      <div
                        className={`px-3.5 py-2 rounded-2xl text-xs max-w-[80%] ${
                          m.sender === 'user'
                            ? 'bg-[#f01e2c] text-white font-medium'
                            : 'bg-white/10 text-white'
                        }`}
                      >
                        {m.text}
                      </div>
                      <span className="text-[9px] text-gray-500 mt-0.5">{m.time}</span>
                    </div>
                  ))}
                </div>

                <form onSubmit={sendChatMessage} className="flex gap-2 pt-2 border-t border-white/10">
                  <input
                    value={chatDraft}
                    onChange={(e) => setChatDraft(e.target.value)}
                    placeholder="Message Bilal Ahmed..."
                    className="flex-1 bg-[#1C1C20] border border-white/15 rounded-xl px-3 py-2 text-xs text-white outline-none"
                  />
                  <button type="submit" className="p-2.5 bg-[#f01e2c] text-white rounded-xl font-bold">
                    <Send className="w-4 h-4" />
                  </button>
                </form>
              </div>
            </div>
          )}

          {/* ==================== FOOTER ==================== */}
          <footer className="bg-[#080809] border-t border-white/10 py-12 mt-16">
            <div className="max-w-7xl mx-auto px-4 sm:px-6 grid sm:grid-cols-3 gap-8 text-xs text-gray-400">
              <div className="space-y-2">
                <h4 className="font-serif text-lg font-bold text-white">TSO — THE SMASH OVE</h4>
                <p>7, Shalimar Colony, Model Town, Multan, Punjab, Pakistan.</p>
                <p className="text-[#f01e2c]">Open Daily: 9:00 AM – 5:00 AM</p>
              </div>
              <div className="space-y-2">
                <h4 className="font-bold text-white uppercase tracking-wider">Verified Policies</h4>
                <p>• 100% Halal Certified Meat & Ingredients</p>
                <p>• Flat Rs. 150 Delivery Across Multan</p>
                <p>• 16% PRA Standard GST Included at Checkout</p>
              </div>
              <div className="space-y-2">
                <h4 className="font-bold text-white uppercase tracking-wider">Order & Support Desk</h4>
                <p>Multan Branch Desk: (061) 622-4589</p>
                <p>Active Promo Codes: TSO10 (10% Off) • SMASH200 (Rs. 200 Off)</p>
              </div>
            </div>
          </footer>

          {/* ==================== MOBILE STICKY BOTTOM BAR ==================== */}
          <div className="md:hidden fixed bottom-0 inset-x-0 z-40 bg-[#0B0B0C]/95 backdrop-blur-lg border-t border-[#f01e2c]/30 grid grid-cols-4 py-2 px-2">
            <button
              onClick={() => setActiveTab('home')}
              className={`flex flex-col items-center gap-1 py-1 text-[11px] ${
                activeTab === 'home' ? 'text-[#f01e2c] font-bold' : 'text-gray-400'
              }`}
            >
              <Sparkles className="w-4 h-4" />
              Home
            </button>
            <button
              onClick={() => setActiveTab('menu')}
              className={`flex flex-col items-center gap-1 py-1 text-[11px] ${
                activeTab === 'menu' ? 'text-[#f01e2c] font-bold' : 'text-gray-400'
              }`}
            >
              <Utensils className="w-4 h-4" />
              Menu
            </button>
            <button
              onClick={() => setActiveTab('tracking')}
              className={`flex flex-col items-center gap-1 py-1 text-[11px] ${
                activeTab === 'tracking' ? 'text-[#f01e2c] font-bold' : 'text-gray-400'
              }`}
            >
              <Bike className="w-4 h-4" />
              Track
            </button>
            <button
              onClick={() => setActiveTab('reservations')}
              className={`flex flex-col items-center gap-1 py-1 text-[11px] ${
                activeTab === 'reservations' ? 'text-[#f01e2c] font-bold' : 'text-gray-400'
              }`}
            >
              <Calendar className="w-4 h-4" />
              Reserve
            </button>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
